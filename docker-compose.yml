services:
  backend:
    build:
      context: ./backend
    image: stocksense-ai-backend
    ports:
      - "8010:8010"
    environment:
      STOCKSENSE_DATABASE_URL: sqlite:////data/stocksense.db
      STOCKSENSE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - stocksense-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend directly, so this must be a URL the
        # browser can reach. Adjust if you deploy the API on another host.
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8010
    image: stocksense-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stocksense-data:
